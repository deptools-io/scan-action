name: 'Deptools Scan'
description: 'Trigger a Deptools dependency scan, optionally gate your CI on the result and download the SBOM'
author: 'Deptools'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  project-id:
    description: 'Your Deptools project UUID'
    required: true
  api-key:
    description: 'Your Deptools API key (store as a secret)'
    required: true
  wait-for-result:
    description: 'Block the job until the scan completes'
    required: false
    default: 'false'
  fail-on-cvss:
    description: 'Fail the job if a vulnerability at or above this severity is found (CRITICAL, HIGH, MODERATE, LOW)'
    required: false
    default: ''
  min-score:
    description: 'Fail the job if the overall Deptools score is below this value (0-10)'
    required: false
    default: ''
  fail-on-strong-copyleft:
    description: 'Fail the job if any dependency has a strong copyleft license (e.g. GPL)'
    required: false
    default: 'false'
  min-up-to-date:
    description: 'Fail the job if the percentage of direct dependencies on their latest version is below this value (0-100)'
    required: false
    default: ''
  timeout:
    description: 'Maximum seconds to wait for the scan to complete (only used when wait-for-result is true)'
    required: false
    default: '300'
  api-url:
    description: 'Deptools API base URL (override for self-hosted or staging environments)'
    required: false
    default: 'https://api.deptools.io'
  version:
    description: 'Product version written in the SBOM (e.g. 2.4.0). The scan analyzes the branch configured on the Deptools project, not the ref of this job: only pass a version that matches that branch.'
    required: false
    default: ''
  sbom-format:
    description: 'Download the SBOM of the scan once it completes: cyclonedx or spdx. Implies wait-for-result.'
    required: false
    default: ''
  sbom-path:
    description: 'Where to write the SBOM, relative to the workspace (default: deptools-sbom.cdx.json or deptools-sbom.spdx.json)'
    required: false
    default: ''
  artifact:
    description: 'Path of the file this job built (relative to the workspace), e.g. target/app-2.4.0.jar. Its name and SHA-512 are computed here and written in the SBOM for your product; the file itself is never sent. Run this step after the build. A missing file gives a warning, never a failed job.'
    required: false
    default: ''
  artifact-url:
    description: 'Where that file can be downloaded (e.g. its release asset URL), written in the SBOM'
    required: false
    default: ''
  fail-on-sbom-error:
    description: 'Fail the job if the SBOM cannot be downloaded (default: a warning, since the scan itself succeeded)'
    required: false
    default: 'false'
  vex:
    description: 'Download the pre-filled VEX of the scan once it completes (CycloneDX: the known vulnerabilities of the components, for you to assess). Works with or without sbom-format. Implies wait-for-result.'
    required: false
    default: 'false'
  vex-path:
    description: 'Where to write the VEX, relative to the workspace (default: deptools-vex.cdx.json)'
    required: false
    default: ''
  fail-on-vex-error:
    description: 'Fail the job if the VEX cannot be downloaded (default: a warning, since the scan itself succeeded)'
    required: false
    default: 'false'

outputs:
  job-id:
    description: 'The scan job UUID returned by the API'
  status:
    description: 'Final scan status: running | completed | failed | skipped'
  overall-score:
    description: 'Overall Deptools score (0-10), populated when wait-for-result is true and scan completed'
  poll-url:
    description: 'URL to poll for scan status'
  commercial-use:
    description: 'true if at least one dependency has a strong copyleft license, populated when wait-for-result is true and scan completed'
  direct-up-to-date:
    description: 'Percentage of direct dependencies on their latest version (0-100), populated when wait-for-result is true and scan completed'
  sbom-file:
    description: 'Absolute path of the downloaded SBOM, empty when sbom-format is set but no SBOM could be downloaded'
  vex-file:
    description: 'Absolute path of the downloaded VEX, empty when vex is true but no VEX could be downloaded'

runs:
  using: 'node24'
  main: 'dist/index.js'
